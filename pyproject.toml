[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "comfyui-mcp-server"
version = "2.0.0"
description = "Agentic ComfyUI image generation over the Model Context Protocol: batch discovery, LoRA shaping, and provenance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "David Newman", email = "david@retiform.dev" },
  { name = "Guan", email = "guan@retiform.dev" },
]
keywords = ["comfyui", "mcp", "model-context-protocol", "stable-diffusion", "image-generation", "lora", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]

# mcp<2 is a HARD upper bound, not caution: in mcp 2.x, mcp.server.fastmcp is a
# stub module whose only content is a ModuleNotFoundError with a migration
# pointer. Installing 2.x makes this package fail at import, on every platform.
dependencies = [
  "mcp>=1.27.0,<2",
  "requests>=2.31.0",
  "psutil>=5.9.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://retiform.dev"
Repository = "https://github.com/retiform-labs/comfyui-mcp-server"
Issues = "https://github.com/retiform-labs/comfyui-mcp-server/issues"

[project.scripts]
comfyui-mcp-server = "comfyui_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
