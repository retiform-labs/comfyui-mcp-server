[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retiform-comfyui-mcp"
dynamic = ["version"]
description = "Agentic ComfyUI image generation over the Model Context Protocol: batch discovery, LoRA shaping, and provenance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "David Newman", email = "david@retiform.dev" },
  { name = "Guan", email = "guan@retiform.dev" },
]
keywords = ["comfyui", "mcp", "model-context-protocol", "stable-diffusion", "image-generation", "lora", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]

# mcp<2 is a HARD upper bound, not caution: in mcp 2.x, mcp.server.fastmcp is a
# stub module whose only content is a ModuleNotFoundError with a migration
# pointer. Installing 2.x makes this package fail at import, on every platform.
dependencies = [
  "mcp>=1.27.0,<2",
  "requests>=2.31.0",
  "psutil>=5.9.0",
  # Pillow is pinned to 13 because everything below it carries advisories in the
  # image decoders, which is the surface this package actually touches: it calls
  # Image.open() on files handed to it by a client. 13.0.0 ships cp311 wheels
  # only, which is why requires-python is >=3.11 -- Python 3.10 reached
  # end-of-life on 2026-10-01, so the floor is not costing anyone a supported
  # interpreter.
  "Pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://retiform.dev"
Repository = "https://github.com/retiform-labs/comfyui-mcp-server"
Issues = "https://github.com/retiform-labs/comfyui-mcp-server/issues"

[project.scripts]
comfyui-mcp-server = "comfyui_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_mcp_server"]

[tool.hatch.version]
# Single source of truth: the package declares __version__, the build reads it.
# Declaring the version twice let them drift before -- the installed package
# reported one version while the registry metadata said another.
path = "src/comfyui_mcp_server/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # line length is handled by the formatter's target, not lint
  "B007",   # `for _key, value in d.items()` with the key unused is idiomatic
  "SIM105", # try/except/pass around best-effort metadata writes is intentional
  "SIM102", # nested `if` reads better than one long conjunction here
  "SIM108", # ternaries hide the branch intent in the workflow-mutation code
]

[tool.ruff.lint.per-file-ignores]
# Test modules bootstrap sys.path before importing the package under test, so
# their imports are necessarily below a statement. This is the pattern working.
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
